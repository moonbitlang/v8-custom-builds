name: Publish tested archives

# Promote consumer-tested archives after merge. Publishing never recompiles V8.
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful five-platform Rust crate run validating the tagged main commit
        required: true
        type: string
      tag:
        description: Existing main-branch tag matching the wrapper release pin (v0.106.0-moonbit.N)
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify qualification and stage the exact tested bytes
        run: |
          python3 ci/native_artifacts.py prepare-release \
            --validation-run "$VALIDATION_RUN" --tag "$RELEASE_TAG" --output artifacts
      - name: Publish release
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
            --notes-file artifacts/release-notes.md \
            artifacts/native-*/* artifacts/promotion.json
