name: Check recipe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts and patches
        run: |
          shellcheck build.sh ci/*.sh
          bash -n build.sh
          git submodule update --init --checkout --depth=1 rusty_v8
          git -C rusty_v8 submodule update --init --depth=1 build v8
          python3 tools/prepare-source.py
          python3 tools/compare-adapter.py > /dev/null
      - name: Check public headers as C and C++
        run: |
          for extensions in 0 1; do
            cc -std=c11 -Werror -DLIBWASM_STATIC -DWEE8_EXTENSIONS="$extensions" \
              -Icustom_wee8/include \
              -fsyntax-only ci/c-api/headers.c
            c++ -std=c++17 -Werror -DLIBWASM_STATIC -DWEE8_EXTENSIONS="$extensions" \
              -Icustom_wee8/include \
              -x c++ -fsyntax-only ci/c-api/headers.c
          done
      - name: Check workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_*_linux_amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/actionlint_*_linux_amd64.tar.gz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
