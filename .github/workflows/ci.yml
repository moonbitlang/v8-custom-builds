name: Check recipe

on:
  pull_request:
  push:
    branches: [main]
    paths: ['**.sh', '.github/**', 'ci/**', 'patches/**', 'licenses/**', '.gitmodules', 'rusty_v8']

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell scripts and patches
        run: |
          shellcheck build.sh ci/*.sh
          bash -n build.sh
          git submodule update --init --depth=1 rusty_v8
          git -C rusty_v8 submodule update --init --depth=1 build v8
          for patch in patches/*.patch; do
            git -C rusty_v8 apply "../$patch"
          done
          echo '7b6414f525d503a27609f0dfc3a33fa135f5cdf22d8b03f9e20a948ee8e62301  rusty_v8/v8/third_party/wasm-api/wasm.h' | sha256sum -c -
      - name: Check workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.7.12 --repo rhysd/actionlint --pattern 'actionlint_*_linux_amd64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/actionlint_*_linux_amd64.tar.gz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
