name: Build and test
run-name: Build and test (${{ inputs.target }})

# V8 is expensive: neither pushes nor PR updates start a native build.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build and test
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.95.0
  PYTHON_VERSION: '3.11'
  ARM64_CLANG_VERSION: 18
  MOON_REVISION: 3f8b984d4d35cf78e9a3d51543a8df415a505987
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  platforms:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: select
        env:
          TARGET: ${{ inputs.target }}
        run: echo "matrix=$(jq -c --arg target "$TARGET" '{include:[.[] | select($target == "all" or .target == $target)]}' ci/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      # This also overrides rusty_v8's older rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: 1.95.0-${{ matrix.target }}
    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python }}
      - name: Native Linux ARM64 compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y "clang-$ARM64_CLANG_VERSION" "libclang-$ARM64_CLANG_VERSION-dev" "libclang-rt-$ARM64_CLANG_VERSION-dev" "lld-$ARM64_CLANG_VERSION"
          echo "CLANG_BASE_PATH=/usr/lib/llvm-$ARM64_CLANG_VERSION" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$ARM64_CLANG_VERSION/lib" >> "$GITHUB_ENV"
      - name: Native cache key
        id: native-key
        env:
          RECIPE: ${{ hashFiles('build.sh', 'patches/*.patch') }}
        run: echo "key=native-$TARGET-${{ matrix.runner }}-$RUST_VERSION-$PYTHON_VERSION-$ARM64_CLANG_VERSION-${ImageVersion}-$(git rev-parse HEAD:rusty_v8)-$RECIPE" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native
        with:
          path: dist/${{ matrix.target }}
          key: ${{ steps.native-key.outputs.key }}
      - name: Build native archive
        if: steps.native.outputs.cache-hit != 'true'
        run: bash build.sh
      # Save before the downstream tests, so a test failure does not discard hours of work.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: dist/${{ matrix.target }}
          key: ${{ steps.native-key.outputs.key }}
      - name: Checkout Moonrun validation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moonbitlang/moon
          ref: ${{ env.MOON_REVISION }}
          path: moon
          submodules: recursive
      - uses: Swatinem/rust-cache@401aff9a7a08acb9d27b64936a90db81024cff97 # v2.8.2
        with:
          workspaces: moon
          shared-key: moon-${{ steps.native-key.outputs.key }}
      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = 'nightly'
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Test packaged archive with Moonrun
        run: bash ci/test.sh
      - name: Install Zig for Linux compatibility check
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.15.2
      - name: Check Linux glibc 2.23 compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install --locked --version 0.22.1 cargo-zigbuild
          bash ci/check-glibc.sh
      - name: Record validation provenance
        run: |
          jq -n --arg revision "$GITHUB_SHA" --arg moon "$MOON_REVISION" --arg target "$TARGET" \
            --arg run "$GITHUB_RUN_ID" --arg rust "$(rustc --version)" --arg compiler "$(moonc -v)" \
            '{recipe:$revision,moon:$moon,target:$target,run:$run,rust:$rust,moonc:$compiler}' \
            > "dist/$TARGET/validation_$TARGET.json"
          (cd "dist/$TARGET"
           if command -v sha256sum >/dev/null; then
             sha256sum ./*.gz ./*.rs ./*.txt ./*.json
           else
             shasum -a 256 ./*.gz ./*.rs ./*.txt ./*.json
           fi > "SHA256SUMS_$TARGET")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
