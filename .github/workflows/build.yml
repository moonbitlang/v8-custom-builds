name: Build and test
run-name: Build and test (${{ inputs.target }})

# V8 is expensive: neither pushes nor PR updates start a native build.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build and test
        type: choice
        default: all
        options:
          - all
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
      rebuild:
        description: Rebuild from source, reusing the compiler cache
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: 1.95.0
  PYTHON_VERSION: '3.11'
  ARM64_CLANG_VERSION: 18
  CARGO_TERM_COLOR: always

jobs:
  platforms:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: select
        env:
          TARGET: ${{ inputs.target }}
        run: echo "matrix=$(jq -c --arg target "$TARGET" '{include:[.[] | select($target == "all" or .target == $target)]}' ci/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    # A full matrix and a targeted retry must not compile the same platform twice.
    concurrency:
      group: native-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      CARGO_BUILD_JOBS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 4 || 3 }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_IDLE_TIMEOUT: '0'
      # This also overrides rusty_v8's older rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: 1.95.0-${{ matrix.target }}
    steps:
      - name: Configure Git
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$TARGET"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python }}
      - name: Native Linux ARM64 compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y "clang-$ARM64_CLANG_VERSION" "libclang-$ARM64_CLANG_VERSION-dev" "libclang-rt-$ARM64_CLANG_VERSION-dev" "lld-$ARM64_CLANG_VERSION"
          echo "CLANG_BASE_PATH=/usr/lib/llvm-$ARM64_CLANG_VERSION" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$ARM64_CLANG_VERSION/lib" >> "$GITHUB_ENV"
      - name: Native cache key
        id: native-key
        env:
          RECIPE: ${{ hashFiles('build.sh', 'tools/native/**', 'custom_wee8/BUILD.gn', 'custom_wee8/src/**', 'custom_wee8/include/**', 'custom_wee8/tests/*.cc', 'custom_wee8/tests/BUILD.gn', 'patches/*.patch', 'licenses/*') }}
        run: echo "key=native-$TARGET-${{ matrix.runner }}-$RUST_VERSION-$PYTHON_VERSION-$ARM64_CLANG_VERSION-${ImageVersion}-$(git rev-parse HEAD:rusty_v8)-$RECIPE" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native
        with:
          path: |
            dist/${{ matrix.target }}
            target/native-checks/${{ matrix.target }}
          key: ${{ steps.native-key.outputs.key }}
          lookup-only: ${{ inputs.rebuild }}
      - name: Install C++ compiler cache
        if: inputs.rebuild || steps.native.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Build native archive
        if: inputs.rebuild || steps.native.outputs.cache-hit != 'true'
        run: bash build.sh
      # Save before validation, so a test failure does not discard hours of work.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.native.outputs.cache-hit != 'true'
        with:
          path: |
            dist/${{ matrix.target }}
            target/native-checks/${{ matrix.target }}
          key: ${{ steps.native-key.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/wee8 -> ../../target/wee8
            ci/c-api -> ../../target/c-api
          # Relink consumers against the archive selected by this native run.
          cache-targets: false
          shared-key: smoke-registry-${{ steps.native-key.outputs.key }}
      - name: Check custom wee8 context and implementation selections
        run: python3 custom_wee8/tests/check.py "target/native-checks/$TARGET"
      - name: Test packaged Wasm C API archive
        run: bash ci/test-c-api.sh
      - name: Install Zig for Linux compatibility check
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: 0.15.2
      - name: Check Linux glibc 2.23 compatibility
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install --locked --version 0.22.1 cargo-zigbuild
          bash ci/check-glibc.sh
      - name: Record validation provenance
        run: |
          jq -n --arg revision "$GITHUB_SHA" --arg target "$TARGET" \
            --arg run "$GITHUB_RUN_ID" --arg rust "$(rustc --version)" \
            '{recipe:$revision,target:$target,run:$run,rust:$rust}' \
            > "dist/$TARGET/validation_$TARGET.json"
          (cd "dist/$TARGET"
           if command -v sha256sum >/dev/null; then
             sha256sum ./*.gz ./*.h ./*.txt ./*.json
           else
             shasum -a 256 ./*.gz ./*.h ./*.txt ./*.json
           fi > "SHA256SUMS_$TARGET")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
