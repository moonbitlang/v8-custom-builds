name: Rust crate

# Select matching native artifacts automatically; consumers never compile V8.
on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build and test]
    types: [completed]
  workflow_dispatch:
    inputs:
      native-run:
        description: Optional successful native run; otherwise select matching artifacts automatically
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rust-crate-${{ github.event.workflow_run.head_branch || github.ref }}-${{ inputs.native-run || github.event.workflow_run.id || 'auto' }}
  cancel-in-progress: true

jobs:
  archives:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    outputs:
      source: ${{ steps.select.outputs.source }}
      matrix: ${{ steps.select.outputs.matrix }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Rust-only follow-ups on the producer branch use the same native build.
          ref: ${{ github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || github.sha }}
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native-run || github.event.workflow_run.id }}
        run: |
          python3 ci/native_artifacts.py select --native-run "$NATIVE_RUN" --output candidate.json
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-candidate
          path: candidate.json
          if-no-files-found: error
          retention-days: 30

  test:
    needs: archives
    name: wee8 / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.archives.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      RUSTUP_TOOLCHAIN: 1.95.0
    defaults:
      run:
        shell: bash
        working-directory: crates/wee8
    steps:
      - name: Configure Git
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.archives.outputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/wee8
          shared-key: wee8-crate
          cache-targets: false
      - name: Check and test the published release
        if: needs.archives.outputs.source == 'release'
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check and test selected archives
        if: needs.archives.outputs.source == 'run'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/native_artifacts.py download candidate.json --target "$TARGET" --output "dist/$TARGET"
          bash ci/test-c-api.sh
          root=$PWD
          archive=libwee8.a
          if [[ "$TARGET" == *-windows-msvc ]]; then
            root=$(cygpath -m "$root")
            archive=wee8.lib
          fi
          export WEE8_ARCHIVE="$root/target/c-api-native/$archive"
          export WEE8_HEADER="$root/target/c-api-native/wee8.h"
          cargo fmt --manifest-path crates/wee8/Cargo.toml --check
          cargo clippy --locked --all-targets --manifest-path crates/wee8/Cargo.toml --target-dir target/wee8 -- -D warnings
          python3 ci/native_artifacts.py receipt candidate.json --target "$TARGET" --package "dist/$TARGET" --output "$TARGET.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.archives.outputs.source == 'run'
        with:
          name: consumer-${{ matrix.target }}
          path: ${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30

  qualification:
    needs: [archives, test]
    if: needs.archives.outputs.source == 'run'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.archives.outputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-candidate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: consumer-*
          merge-multiple: true
          path: receipts
      - name: Record release-target qualification
        run: python3 ci/native_artifacts.py qualify candidate.json --receipts receipts --output qualification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wee8-validation
          path: qualification.json
          if-no-files-found: error
          retention-days: 30
